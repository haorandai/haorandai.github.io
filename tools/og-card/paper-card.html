<!doctype html>
<!-- Link-preview card (Open Graph image, 1200x630) for a paper project page, in the same style as
     card.html. Pick the paper with the hash, e.g. paper-card.html#tides; render-papers.sh renders
     all of them into each project page's assets/og-card.png. -->
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #faf6f0;
    --glow-blue: rgba(9, 105, 218, 0.13);
    --glow-orange: rgba(255, 107, 53, 0.13);
    --ink: #1f2328;
    --text: #44403a;
    --muted: #6b665e;
    --accent: #0969da;
    --panel: #ffffff;
    --hairline: #ebe7df;
  }
  html, body { margin: 0; padding: 0; }
  .card {
    width: 1200px; height: 630px; box-sizing: border-box; position: relative; overflow: hidden;
    background-color: var(--bg);
    background-image:
      radial-gradient(55% 80% at 92% 4%, var(--glow-blue), transparent 62%),
      radial-gradient(48% 80% at 2% 104%, var(--glow-orange), transparent 62%);
    font-family: 'Geist', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; padding: 50px 72px 0;
  }
  .venue { font-size: 19px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
  .title {
    margin-top: 12px; font-size: 44px; line-height: 1.1; font-weight: 700; letter-spacing: -0.025em; color: var(--ink);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-wrap: balance;
  }
  .authors { margin-top: 12px; font-size: 20px; font-weight: 500; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .authors b { color: var(--text); font-weight: 600; }
  .figure {
    flex: 1; min-height: 0; margin: 24px 0 92px; background: var(--panel); border-radius: 14px;
    border: 1px solid var(--hairline); box-shadow: 0 14px 36px rgba(31, 35, 40, .08);
    display: flex; align-items: center; justify-content: center; padding: 16px 24px; box-sizing: border-box;
  }
  .figure img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .footer {
    position: absolute; left: 72px; right: 72px; bottom: 30px;
    display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid var(--hairline); padding-top: 18px;
    font-size: 20px; font-weight: 500; color: var(--muted);
  }
  .brand { display: flex; align-items: center; gap: 12px; color: var(--ink); font-weight: 600; letter-spacing: -0.01em; }
  .brand img { width: 30px; height: 30px; }
</style>
</head>
<body>
  <div class="card">
    <div class="venue" id="venue"></div>
    <div class="title" id="title"></div>
    <div class="authors" id="authors"></div>
    <div class="figure"><img id="fig" alt=""></div>
    <div class="footer">
      <span class="brand"><img src="../../source/img/logo.svg" alt="">Harry (Haoran) Dai</span>
      <span id="url"></span>
    </div>
  </div>
<script>
  // Facts are copied from each project page and source/publications/index.md; the figure is the page's own asset.
  const SITES = '../../../../Downloads/01_🔬_Academic_Research/Research_Project_Directories/IITfiles/OASIS/paper-websites/';
  const PAPERS = {
    tides: {
      venue: 'ES-Reasoning @ ICLR 2026 · Spotlight',
      title: 'TIDES: Test-time Inference Drift Exploitation via Scaling',
      authors: '<b>Haoran Dai*</b>, Haozheng Luo*, Haotian Zhang, Meng Lin, Yan Chen, Binghui Wang',
      fig: 'tides/assets/method.png',
      url: 'haorandai.com/tides-paper',
    },
    t2i: {
      venue: 'arXiv 2025',
      title: 'Practical, Generalizable and Robust Backdoor Attacks on Text-to-Image Diffusion Models',
      authors: '<b>Haoran Dai</b>, Jiawen Wang, Ruo Yang, Manali Sharma, Zhonghao Liao, Yuan Hong, Binghui Wang',
      fig: 't2i-backdoor/assets/triggered-generation.webp',
      url: 'haorandai.com/practical-t2i-backdoors',
    },
    vectorgym: {
      venue: 'EMNLP 2026 · Benchmark',
      title: 'VectorGym: A Multi-Task Benchmark for SVG Code Generation, Sketching and Editing',
      authors: 'Joan Rodriguez, Haotian Zhang, Abhay Puri, <b>Haoran Dai</b>, … Christopher Pal, Marco Pedersoli',
      fig: 'vectorgym/assets/overview.webp',
      url: 'haorandai.com/vectorgym',
    },
  };
  const p = PAPERS[location.hash.slice(1)] || PAPERS.tides;
  for (const k of ['venue', 'title', 'url']) document.getElementById(k).textContent = p[k];
  document.getElementById('authors').innerHTML = p.authors;
  document.getElementById('fig').src = SITES + p.fig;
</script>
</body>
</html>
