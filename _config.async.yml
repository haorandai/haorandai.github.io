# hexo-theme-async config for Haoran Dai
# Based on dracewang's Async setup, customized. Keys follow async v2.2.7 (snake_case).

user:
  name: Harry (Haoran) Dai
  first_name: Dai
  last_name: Harry
  email: haorand16@gmail.com
  domain: haorandai.com
  avatar: /img/haoran.jpg
  describe: AI/ML Researcher, CS PhD Candidate at Illinois Tech, Research Scientist at QuiverAI

favicon:
  logo: /img/logo.svg
  icon16: /img/favicon-16.png
  icon32: /img/favicon-32.png
  apple_touch_icon: /img/apple-touch-icon.png
  visibilitychange: false

# Top navigation
top_bars:
  - title: menu.home
    url: /
  - title: Publications
    url: /publications/
  - title: More
    url: /more/

# Hero banner text per page
banner:
  index:
    banner_title: 'Trustworthy &amp; Efficient<br>Generative AI.<span class="trm-hero-kw"><span>Backdoor Attacks</span><span>Diffusion Models</span><span>Reasoning Models</span><span>Test-time Scaling</span><span>Efficient Inference</span><span>Vision-Language Models</span><span>SVG &amp; Vector Graphics</span><span>AI Agents</span></span>'
    banner_text: Hi, I'm Harry (Haoran) Dai!
  archive:
    banner_title: The Archive.
    banner_text: All my posts
  about:
    banner_title: About Me.
    banner_text: Who I am

# Sidebar profile card
sidebar:
  typed_text_prefix: ''
  typed_text:
    - AI/ML Researcher
    - Research Scientist
    - CS PhD Candidate
  info:
    - key: Focus
      val: "Trustworthy & Efficient AI"
    - key: Advisor
      val: Binghui Wang
    - key: Location
      val: Chicago, IL
  social:
    - name: Github
      icon: fab fa-github
      url: https://github.com/haorandai
    - name: Google Scholar
      icon: fas fa-graduation-cap
      url: https://scholar.google.com/citations?user=bZXkw3QAAAAJ&hl=en
    - name: LinkedIn
      icon: fab fa-linkedin
      url: https://www.linkedin.com/in/haorandai
    - name: Email
      icon: far fa-envelope
      url: mailto:haorand16@gmail.com

# About page
about:
  insert: none
  title: Trustworthy & Secure AI
  introduction: >-
    Hi, I'm <strong>Haoran Dai</strong>, an AI Researcher at QuiverAI and a CS
    PhD student at the Illinois Institute of Technology, advised by Professor
    Binghui Wang. My research addresses security and safety challenges in
    multimodal AI.
  blog: '<ul class="trm-list"><li>Built with Hexo</li><li>Theme: hexo-theme-async</li></ul>'
  privacy: This website does not track visitors and does not collect any personal information.

# Minimal footer: a single custom line, no powered-by or theme credit.
footer:
  powered:
    enable: false
  beian:
    enable: false
  copyright_year:
  live_time:
    enable: false
  custom_text: '© Haoran Dai'

# Site search off: three pages don't need it
search:
  enable: false

creative_commons:
  license: by-nc-sa
  language: deed.en
  post: false
  clipboard: false

# Smooth page transitions
swup: true

toc:
  enable: true
  list_number: true
  max_depth: 6
  min_depth: 1

rightside:
  readmode: true
  aside: true

# Light/dark, allow toggle
theme:
  enable: true
  default: auto

# Link previews (Hexo's built-in open_graph helper, called by the theme)
open_graph:
  image: /img/haoran.jpg
  twitter_card: summary
